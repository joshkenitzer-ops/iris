<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris</title>

<link rel="stylesheet" href="/static/lore-tokens.css">
<link rel="stylesheet" href="/static/iris-theme.css">
<link rel="stylesheet" href="/static/iris-app.css">

<!--
  There are deliberately NO Clerk script tags or Clerk values in this
  file. app.js fetches /config at boot and injects the Clerk bundles
  with the correct URLs at runtime.

  This is not incidental. These values used to be hardcoded here, and
  on 2026-07-25 shipping an unrelated change to this file overwrote a
  live deployment's real values with placeholders and took sign-in
  down completely. Anything that differs between environments belongs
  in the server's environment, not in a file that gets replaced
  wholesale. See the /config endpoint in app/main.py.

  To configure: set CLERK_PUBLISHABLE_KEY and CLERK_ISSUER as
  environment variables on the server. Nothing to edit here.
-->
</head>
<body>

<!-- Shown until Clerk finishes loading and resolves sign-in state. -->
<div id="boot-loading" class="boot-loading">
  <span class="lore-display boot-mark">Iris</span>
</div>

<!-- Clerk mounts its own sign-in widget here for a signed-out visitor. -->
<div id="sign-in-container" class="sign-in-container" hidden></div>

<!-- The actual app. Hidden until Clerk confirms the visitor is signed in. -->
<div id="app" class="app" hidden>

  <header class="app-header">
    <span class="lore-display app-wordmark">Iris</span>
    <div class="header-actions">
      <button id="new-session-btn" class="lore-btn-ghost">New session</button>
      <div id="user-button-container"></div>
    </div>
  </header>

  <main class="chat-main">
    <div id="message-list" class="message-list" aria-live="polite"></div>

    <div id="thinking-indicator" class="thinking-indicator" hidden>
      <span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span>
    </div>
  </main>

  <footer class="composer">
    <div id="attachment-chip" class="attachment-chip" hidden>
      <span id="attachment-chip-label"></span>
      <button id="attachment-chip-remove" class="attachment-chip-remove" aria-label="Remove attachment">&times;</button>
    </div>

    <div class="composer-row">
      <button id="attach-btn" class="lore-btn-ghost composer-attach" aria-label="Attach a resume or job posting" title="Attach a .docx or .pdf">
        +
      </button>
      <input type="file" id="file-input" accept=".docx,.pdf" hidden>
      <textarea
        id="message-input"
        class="lore-input composer-input"
        placeholder="Paste a job description, ask a question, or attach a resume to get started"
        rows="5"
      ></textarea>
      <button id="send-btn" class="lore-btn-primary composer-send">Send</button>
    </div>
  </footer>

</div>

<script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris</title>

<link rel="stylesheet" href="/static/lore-tokens.css">
<link rel="stylesheet" href="/static/iris-theme.css">
<link rel="stylesheet" href="/static/iris-app.css">

<!--
  Clerk's officially documented script-tag setup
  (clerk.com/docs/js-frontend), left exactly as they specify.

  __CLERK_FRONTEND_HOST__ and __CLERK_PUBLISHABLE_KEY__ are
  substituted by the server when it serves this page: see the `/`
  route in app/main.py. They are PERMANENT template tokens, not
  config waiting to be filled in. Do not replace them with real
  values; set CLERK_ISSUER and CLERK_PUBLISHABLE_KEY in the server's
  environment instead.

  Why it works this way: these values used to be hardcoded here, and
  on 2026-07-25 shipping an unrelated change to this file overwrote a
  live deployment's real values and took sign-in down. Templating
  keeps environment-specific values in the environment (where
  ANTHROPIC_API_KEY and the rest already live) while preserving
  Clerk's known-good static script tags, rather than injecting the
  bundles at runtime, which the Clerk loader does not reliably
  support.
-->
<script
  defer
  crossorigin="anonymous"
  src="https://__CLERK_FRONTEND_HOST__/npm/@clerk/ui@1/dist/ui.browser.js"
  type="text/javascript"
></script>
<script
  defer
  crossorigin="anonymous"
  data-clerk-publishable-key="__CLERK_PUBLISHABLE_KEY__"
  src="https://__CLERK_FRONTEND_HOST__/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
  type="text/javascript"
></script>
</head>
<body>

<!-- Shown until Clerk finishes loading and resolves sign-in state. -->
<div id="boot-loading" class="boot-loading">
  <span class="lore-display boot-mark">Iris</span>
</div>

<!-- Clerk mounts its own sign-in widget here for a signed-out visitor. -->
<div id="sign-in-container" class="sign-in-container" hidden></div>

<!-- The actual app. Hidden until Clerk confirms the visitor is signed in. -->
<div id="app" class="app" hidden>

  <header class="app-header">
    <div class="header-brand" aria-hidden="true">
      <span class="lore-mark">Lore</span>
    </div>
    <span class="lore-display app-wordmark">Iris</span>
    <div class="header-actions">
      <button id="new-session-btn" class="lore-btn-ghost">New session</button>
      <div id="user-button-container"></div>
    </div>
  </header>

  <main class="chat-main">
    <div id="empty-state" class="empty-state">
      <h1 class="lore-display empty-state-title">Iris</h1>
      <p class="empty-state-tagline">Resume and cover letter tailoring, backed by a harness that checks its own work.</p>
      <ol class="empty-state-steps">
        <li><span class="step-num">1</span>Attach your master resume</li>
        <li><span class="step-num">2</span>Paste a job description</li>
        <li><span class="step-num">3</span>Get a tailored package with every check already run</li>
      </ol>
      <button id="start-session-btn" class="lore-btn-primary empty-state-btn">Start a session</button>
    </div>
    <div id="message-list" class="message-list" aria-live="polite"></div>

    <div id="status-indicator" class="status-indicator" hidden>
      <span class="status-dot"></span>
      <span id="status-text">Thinking...</span>
    </div>
  </main>

  <footer class="composer" id="composer" hidden>
    <div id="attachment-chip" class="attachment-chip" hidden>
      <span id="attachment-chip-label"></span>
      <button id="attachment-chip-remove" class="attachment-chip-remove" aria-label="Remove attachment">&times;</button>
    </div>

    <div class="composer-row">
      <button id="attach-btn" class="lore-btn-ghost composer-attach" aria-label="Attach a resume or job posting" title="Attach a .docx or .pdf">
        +
      </button>
      <input type="file" id="file-input" accept=".docx,.pdf" hidden>
      <textarea
        id="message-input"
        class="lore-input composer-input"
        placeholder="Paste a job description, ask a question, or attach a resume to get started"
        rows="5"
      ></textarea>
      <button id="send-btn" class="lore-btn-primary composer-send">Send</button>
    </div>
  </footer>

</div>

<script src="/static/app.js"></script>
</body>
</html>
